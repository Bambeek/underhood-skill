<svg xmlns="http://www.w3.org/2000/svg" width="680" height="300" viewBox="0 0 680 300" role="img" aria-labelledby="t d">
<title id="t">Underhood pipeline</title>
<desc id="d">Five skills in order. recon scans the target: engine, anti-cheat (uh scan, uh kb). dig decompiles and decodes: AES keys, formats (REA, uh probe). forge builds and verifies: backup, test in game (uh backup, uh win). art makes local assets: engine-ready files (uh comfy, uh sprite). ship releases and shares: lint, clip, field note (uh publish, uh video). They stand on a shared layer: RULES.md, state.json, MODLOG.md and evidence marked observed, inferred or unknown.</desc>
