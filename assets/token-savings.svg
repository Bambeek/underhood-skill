.sans{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Helvetica,Arial,sans-serif}
.mono{font-family:ui-monospace,SFMono-Regular,Menlo,Consolas,monospace}
.ink{fill:var(--ink)}.t2{fill:var(--t2)}.t3{fill:var(--t3)}.acc{fill:var(--acc)}
.card{fill:url(#bg);stroke:var(--line)}
.aT{fill:var(--acch)}.aL{fill:var(--acc)}.aR{fill:var(--accl)}
.bF{fill:url(#gB)}.bT{fill:var(--bbt)}.bR{fill:var(--bbr)}.seg{fill:var(--seg)}
.uF{fill:url(#gU)}.uT{fill:var(--dl)}.uR{fill:var(--accl)}
.sep{stroke:var(--line);fill:none}
.s0{stop-color:var(--bg0)}.s1{stop-color:var(--bg1)}.sah{stop-color:var(--acch)}.sal{stop-color:var(--accl)}
